<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Roboto, Segoe UI, Helvetica, Arial, sans-serif">
  <title>Auto-Updater: Option „Marketplace-Hinweis bestätigt“ in der Konfiguration</title>
  <rect width="720" height="380" rx="12" fill="#f5f5f5"/>

  <!-- Kopfzeile -->
  <rect x="0" y="0" width="720" height="56" rx="12" fill="#03a9f4"/>
  <rect x="0" y="40" width="720" height="16" fill="#03a9f4"/>
  <text x="24" y="35" font-size="18" fill="#fff" font-weight="500">Auto-Updater</text>
  <text x="520" y="35" font-size="14" fill="#fff" opacity="0.75">Info</text>
  <text x="565" y="35" font-size="14" fill="#fff" font-weight="700">Konfiguration</text>
  <rect x="565" y="46" width="98" height="3" fill="#fff"/>

  <!-- Karte -->
  <rect x="24" y="76" width="672" height="284" rx="10" fill="#fff" stroke="#e0e0e0"/>
  <text x="44" y="108" font-size="17" fill="#212121" font-weight="500">Optionen</text>

  <!-- Zeile: Backup vor Add-on-Updates -->
  <text x="44" y="150" font-size="15" fill="#212121">Backup vor Add-on-Updates</text>
  <rect x="616" y="136" width="40" height="20" rx="10" fill="#03a9f4" opacity="0.5"/>
  <circle cx="646" cy="146" r="10" fill="#03a9f4"/>
  <line x1="44" y1="172" x2="676" y2="172" stroke="#eeeeee"/>

  <!-- Hervorgehobene Zeile -->
  <rect x="34" y="180" width="652" height="84" rx="8" fill="#fff8e1" stroke="#ff9800" stroke-width="2"/>
  <text x="44" y="208" font-size="15" fill="#212121" font-weight="700">Marketplace-Hinweis bestätigt</text>
  <text x="44" y="230" font-size="12.5" fill="#616161">Ich habe den Hinweis zu Community-Software im Marketplace gelesen und akzeptiere ihn.</text>
  <text x="44" y="248" font-size="12.5" fill="#616161">Das Add-on bestätigt ihn damit auch für seinen eigenen Systembenutzer.</text>
  <rect x="616" y="198" width="40" height="20" rx="10" fill="#03a9f4" opacity="0.5"/>
  <circle cx="646" cy="208" r="10" fill="#03a9f4"/>
  <text x="560" y="180" font-size="13" fill="#e65100" font-weight="700">einschalten ➜</text>

  <!-- Zeile: Ausnahmen -->
  <text x="44" y="294" font-size="15" fill="#212121">Ausnahmen</text>
  <line x1="44" y1="310" x2="676" y2="310" stroke="#eeeeee"/>

  <!-- Speichern -->
  <rect x="586" y="320" width="90" height="30" rx="6" fill="#03a9f4"/>
  <text x="631" y="340" font-size="14" fill="#fff" text-anchor="middle" font-weight="500">SPEICHERN</text>
</svg>
